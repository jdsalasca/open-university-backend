# Isolated backend runs on SQLite. MySQL 8.4 remains the target engine and the only engine the
# Flyway migrations and the MySQL contract tests verify; this profile exists so a test run can be
# executed without a database container. Flyway is off because the migrations are MySQL-specific.
spring.datasource.url=jdbc:sqlite:file:./target/open-university-os-test?mode=memory&cache=shared
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=validate