name: Backend CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Maven tests and MySQL contracts
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: universiry_ci
          MYSQL_USER: universiry_ci
          MYSQL_PASSWORD: ci-only-mysql-password
          MYSQL_ROOT_PASSWORD: ci-only-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=universiry_ci --password=ci-only-mysql-password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
          --health-start-period=20s
    env:
      UNIVERSIRY_MYSQL_TEST_URL: "jdbc:mysql://127.0.0.1:3306/universiry_ci?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true"
      UNIVERSIRY_MYSQL_TEST_USERNAME: universiry_ci
      UNIVERSIRY_MYSQL_TEST_PASSWORD: ci-only-mysql-password
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java from SDKMAN version file
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version-file: .sdkmanrc
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run backend suite and MySQL contract tests
        run: bash backend/mvnw --batch-mode --no-transfer-progress -f backend/pom.xml verify -Duniversiry.mysql-contract.enabled=true
